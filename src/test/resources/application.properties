## Test application for the common library. Lives in test sources only, never shipped.
app.code=cmn
app.name=Common test app
app.description=Common library test application

quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17-alpine

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=probe

quarkus.hibernate-orm.database.default-schema=probe

quarkus.keycloak.devservices.enabled=false
quarkus.oidc.tenant-enabled=false

# tenancy: discriminator column, every session needs a tenant (fail-closed resolver in common)
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
quarkus.datasource.jdbc.additional-jdbc-properties.stringtype=unspecified

# the outbound client probe calls this endpoint without a token
quarkus.http.auth.permission.probe-text.paths=/nexo-cmn/probe-logging/text
quarkus.http.auth.permission.probe-text.policy=permit
