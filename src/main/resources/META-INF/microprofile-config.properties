## PLATFORM DEFAULTS (lowest ordinal, every service may override)
## Common ships no application*.properties: a jar profile file would beat a service's plain
## application.properties. Each service sets its own app.* identity, storage, identity provider
## and caching configuration.

## QUARKUS
quarkus.application.name=${app.code}

## REST
quarkus.http.root-path=/nexo-${app.code}
quarkus.http.non-application-root-path=/q

## VALIDATION
quarkus.hibernate-validator.fail-fast=false

## DATABASE
quarkus.hibernate-orm.schema-management.strategy=validate

## SECURITY
quarkus.oidc.application-type=service
#
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
#
quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
#
%dev.quarkus.http.auth.permission.public.paths=${quarkus.swagger-ui.path},${quarkus.swagger-ui.path}/*,${quarkus.smallrye-openapi.path},${quarkus.smallrye-openapi.path}/*
%dev.quarkus.http.auth.permission.public.policy=permit

## OPENAPI / SWAGGER
quarkus.smallrye-openapi.path=${quarkus.http.root-path}/openapi
quarkus.smallrye-openapi.info-title=${app.name}
quarkus.smallrye-openapi.info-description=${app.description}
#
quarkus.swagger-ui.always-include=false
quarkus.swagger-ui.path=${quarkus.http.root-path}/swagger

## LOGGING
quarkus.log.handler.console.app-handler.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] (%t) callId=%X{CALL_ID} associationId=%X{ASSOCIATION_ID} memberId=%X{MEMBER_ID} ip=%X{IP} %s%e%n
#
quarkus.log.category."EXCEPTION".use-parent-handlers=false
quarkus.log.category."EXCEPTION".handlers=app-handler
quarkus.log.category."EXCEPTION".min-level=${app.log.level:INFO}
quarkus.log.category."EXCEPTION".level=${app.log.level:INFO}
#
quarkus.log.category."it".use-parent-handlers=false
quarkus.log.category."it".handlers=app-handler
quarkus.log.category."it".min-level=${app.log.level:INFO}
quarkus.log.category."it".level=${app.log.level:INFO}
