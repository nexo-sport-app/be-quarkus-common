## MICROSERVICES
#app.code= # To be configure
#app.name= # To be configure
#app.description= # To be configure
#app.environment=
#app.hostname=
#app.log.level=

## QUARKUS
quarkus.application.name=${app.code}

## REST
quarkus.http.root-path=/nexo-${app.code}

## VALIDATION
quarkus.hibernate-validator.fail-fast=true

## DATABASE
quarkus.hibernate-orm.schema-management.strategy=none

## CACHE
quarkus.cache.caffeine.initial-capacity=10
quarkus.cache.caffeine.maximum-size=50
quarkus.cache.caffeine.expire-after-write=5M
quarkus.cache.caffeine.metrics-enabled=false
#
quarkus.cache.redis.expire-after-write=10M
quarkus.cache.redis.key-type=java.lang.String
#
quarkus.cache.redis."lib.transcoding.list".expire-after-write=1H
quarkus.cache.redis."lib.transcoding.list".key-type=java.lang.String
quarkus.cache.redis."lib.transcoding.list".value-type=java.util.List
#
quarkus.cache.redis."lib.transcoding.transcode".expire-after-write=30M
quarkus.cache.redis."lib.transcoding.transcode".key-type=java.lang.String

# SECURITY
quarkus.oidc.application-type=service
#
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
#
quarkus.http.auth.permission.public.paths=${quarkus.swagger-ui.path}/*,${quarkus.smallrye-openapi.path}*
quarkus.http.auth.permission.public.policy=permit

## OPENAPI / SWAGGER
quarkus.smallrye-openapi.path=${quarkus.http.root-path}/openapi
quarkus.smallrye-openapi.info-title=${app.name}
quarkus.smallrye-openapi.info-description=${app.description}
#
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=${quarkus.http.root-path}/swagger

## LOGGING
quarkus.log.handler.console.app-handler.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c] (%t) callId=%X{CALL_ID} userId=%X{USER_ID} sessionId=%X{SESSION_ID} ip=%X{IP}\n%s%e%n
#
quarkus.log.category."EXCEPTION".use-parent-handlers=false
quarkus.log.category."EXCEPTION".handlers=app-handler
quarkus.log.category."EXCEPTION".min-level=${app.log.level}
quarkus.log.category."EXCEPTION".level=${app.log.level}
#
quarkus.log.category."it".use-parent-handlers=false
quarkus.log.category."it".handlers=app-handler
quarkus.log.category."it".min-level=${app.log.level}
quarkus.log.category."it".level=${app.log.level}